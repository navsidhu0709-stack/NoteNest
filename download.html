<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Download | NoteNest</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet"
          href="style.css">

    <style>
        .download-page {
            max-width: 700px;
            margin: auto;
            padding: 90px 7%;
            text-align: center;
        }

        .download-box {
            background: white;
            border: 1px solid #eee;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.06);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .download-page h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .download-page p {
            color: #666;
            margin-bottom: 25px;
        }

        .download-btn {
            display: inline-block;
            padding: 15px 25px;
            background: #6c4df6;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .download-btn:hover {
            background: #5638e8;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6c4df6;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

<header class="navbar">

    <div class="logo">
        Note<span>Nest</span>
    </div>

</header>


<main class="download-page">

    <div class="download-box">

        <div class="success-icon">
            🎉
        </div>

        <h1>
            Your Product is Ready!
        </h1>

        <p>
            Thank you for choosing NoteNest.
            Your digital product is ready to download.
        </p>

        <a
            href="products/resume-template.pdf"
            class="download-btn"
            download>
            📥 Download Resume Template
        </a>

        <br>

        <a
            href="index.html"
            class="back-link">
            ← Back to NoteNest
        </a>

    </div>

</main>


<footer>

    <div class="logo">
        Note<span>Nest</span>
    </div>

    <p>
        Digital resources made simple.
    </p>

    <small>
        © 2026 NoteNest. All rights reserved.
    </small>

</footer>

</body>

</html>
