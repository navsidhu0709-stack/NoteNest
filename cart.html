<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cart | NoteNest</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="style.css">

    <style>
/* ===== CART QUANTITY BUTTONS ===== */

.cart-item > div:last-child {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.cart-item > div:last-child > button {
    border: none;
    background: #eeeaff;
    color: #6c4df6;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.cart-item > div:last-child > button:hover {
    background: #ddd6ff;
}

.cart-item > div:last-child > strong {
    min-width: 25px;
    text-align: center;
}

.cart-item .cart-price {
    margin-left: 8px;
}


/* Mobile */

@media (max-width: 600px) {

    .cart-item > div:last-child {
        width: 100%;
    }

    .cart-item .cart-price {
        margin-left: 5px;
    }
}
        .cart-page {
            max-width: 850px;
            margin: auto;
            padding: 80px 7%;
        }

        .cart-page h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .cart-page > p {
            color: #777;
            margin-bottom: 35px;
        }

        .cart-box {
            background: white;
            border: 1px solid #eee;
            border-radius: 18px;
            padding: 30px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 25px;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
        }

        .cart-item h3 {
            margin-bottom: 5px;
        }

        .cart-item p {
            color: #777;
        }

        .cart-price {
            font-size: 20px;
            font-weight: bold;
            margin-right: 15px;
        }

        .cart-item button {
            border: none;
            background: #ffe8e8;
            color: #d33;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .empty-cart {
            text-align: center;
            padding: 30px 0;
            color: #777;
        }

        .shop-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 24px;
            background: #6c4df6;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .shop-btn:hover {
            background: #5638e8;
        }

        .cart-total {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 10px;
        }

        .cart-total h2 {
            margin: 0;
        }

        @media (max-width: 600px) {

            .cart-page {
                padding: 60px 5%;
            }

            .cart-page h1 {
                font-size: 36px;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-total {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            Note<span>Nest</span>
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="index.html#products">
                Products
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

    </header>


    <!-- CART -->

    <main class="cart-page">

        <h1>
            Your Cart 🛒
        </h1>

        <p>
            Review your selected digital products.
        </p>


        <div class="cart-box">

            <!-- JavaScript products here -->

            <div id="cartItems">

            </div>
<div id="checkoutArea" style="display:none; margin-top:25px;">

    <h2 id="cartTotal">
        Total: ₹0
    </h2>

    <br>

    <a href="checkout.html" class="shop-btn">
        Proceed to Checkout →
    </a>

</div>
        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="logo">
            Note<span>Nest</span>
        </div>

        <p>
            Digital resources made simple.
        </p>

        <small>
            © 2026 NoteNest. All rights reserved.
        </small>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
